name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# gap-analysis #24: cancel superseded runs so a rapid push/PR sequence does not
# queue a full 2-OS matrix per commit. Keyed per workflow + ref (push runs on a
# branch and its PR share a ref, so the newer run wins).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token (enterprise/supply-chain hardening): the
# workflow only reads the repo. Actions are pinned to commit SHAs below.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      # G15: validate on Linux (typical CI/CD consumers) and macOS (developer
      # machines). Windows support is tracked separately (D5 / DX1).
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # G16: supply-chain gate — fail on any moderate-or-worse advisory in
      # production dependencies. The threshold was `high` until 2026-08-21, which
      # let a MODERATE prod advisory sit in the tree unflagged for as long as it
      # existed: undici <=6.27.0 (GHSA-8xcm-r25x-g524 response desync via the retry
      # interceptor, GHSA-m8rv-5g2x-5cg5 CRLF injection via blob body `type`,
      # GHSA-v3r7-h72x-cjcm cookie attribute injection) shipped as a production
      # dependency of @syncrona/mcp-server, on the very dispatcher path
      # `servicenowCore.ts` builds for mTLS / custom-CA / proxy. Fixed by 6.28.0.
      # `--omit=dev` scopes this to shipped code; the dev tree is covered by the
      # separate gate below.
      # Production tree measured at 0 vulnerabilities on 2026-08-21 — it then
      # passed even at `--audit-level=low`, so `moderate` has real headroom.
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=moderate

      # Dev-dependency gate. Until 2026-08-25 `--omit=dev` above was the ONLY
      # audit in any workflow, so an advisory in eslint / jest / typescript-eslint
      # / stryker was invisible to CI and to the release gate alike — the full
      # tree carried 11 findings (5 low, 3 moderate, 3 high) that nothing
      # reported. This step is what closes that hole. It is BLOCKING, not
      # informational: a `continue-on-error` step is a warning nobody reads.
      #
      # WHY `high` HERE WHEN PRODUCTION IS GATED AT `moderate` — the two trees
      # carry genuinely different risk, so they get different bars:
      #   * Production deps run on USER machines, in-process with the user's
      #     ServiceNow credentials, against the user's instance. A moderate there
      #     is a user-facing exposure (exactly the undici trio above), so that
      #     gate is set as low as the tree can sustain.
      #   * Dev deps run only here — on maintainer machines and this runner, over
      #     source we wrote ourselves. The realistic threat is a build tool that
      #     can be coerced into executing or exfiltrating something, which is
      #     `high`/`critical` shaped. A moderate ReDoS in a linter's glob parser,
      #     fed only our own file paths, is not that.
      # Setting this to `moderate` would turn every new advisory anywhere in the
      # ~590-package dev tree into an instant hard stop on unrelated PRs. That
      # noise does not get advisories fixed faster; it gets the gate deleted or
      # `|| true`-ed, which is strictly worse than a gate pitched where it bites.
      #
      # This is NOT a threshold chosen to accommodate existing debt: on 2026-08-25
      # the FULL tree was brought to 0 vulnerabilities (brace-expansion and js-yaml
      # via in-range lockfile bumps; stryker's pinned ajv / @babel/core / tmp via
      # the scoped `overrides` in the root package.json). So `high` has the same
      # kind of headroom `moderate` has on the production side.
      #
      # Not a scheduled job that files an issue: this workflow deliberately runs
      # under `permissions: contents: read`, and issue-filing needs `issues: write`.
      # Widening the token to report on dev advisories is a bad trade.
      - name: Security audit (dev + production dependencies)
        run: npm audit --audit-level=high

      # Visibility for what the gate above deliberately does not block on. Prints
      # every low/moderate dev advisory and never fails the job — so sub-`high`
      # findings are DOCUMENTED in the run log rather than silently tolerated.
      # `if: always()` so the report still appears when the blocking gate reddens.
      - name: Dev-dependency advisory report (low + moderate, non-blocking)
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=low

      # `npm run build` compiles every workspace with `tsc` (each package's
      # `prepack`), which type-checks the whole tree — so a separate `typecheck`
      # step (byte-identical to `build`) was pure duplication and was dropped
      # (gap-analysis #24).
      - name: Build all workspaces (also type-checks via tsc)
        run: npm run build

      - name: Lint core + mcp-server (zero warnings)
        run: npm run lint

      - name: Test syncrona
        run: npm run test:core

      - name: Test @syncrona/mcp-server
        run: npm run test:mcp

      - name: Test shared packages (@syncrona/jira + credential-store)
        run: npm run test:shared

      - name: Test build plugin packages
        run: npm run test:plugins

      - name: Coverage gates (core jest thresholds 92/79/89/92, mcp lines>=90% branches>=80%)
        run: npm run test:coverage:gates

      # Both coverage gates record, beside every per-file floor, the measurement the
      # floor was derived from (`// measured L / B`). The two floor audits compare the
      # FLOOR to that annotation and take the annotation on faith, so the annotations
      # rotted unnoticed — and "measured minus floor" is the headroom every
      # raise-the-floor decision is made from. This step compares the annotations to
      # the reports the two steps above just produced (core: Jest json-summary;
      # mcp-server: the persisted TAP report), so it must stay AFTER them.
      # Comparison is exact, with one narrow exception: an mcp-server entry may
      # declare a second reading, `// measured L / B (also L / B: cause)`, because V8
      # range coverage is not reproducible run-to-run on an unchanged tree. Exactly
      # the two declared readings pass and a third is still drift; the core/istanbul
      # side has no such hatch. If this step reddens on a file the PR did not touch,
      # diff the uncovered-LINE column of two reports before the percentage — an
      # unchanged column means V8 granularity, a moved one means a real branch.
      # `test/ciCheckChain.test.js` requires every link of `npm run check` to appear
      # here as its own step.
      - name: Coverage annotation drift (recorded `// measured` vs the real reports)
        run: npm run test:coverage:annotations

      # SKIP_TESTS=1: the mcp suite already ran in the two steps above, so the
      # governance gate skips its redundant third run and only re-checks the
      # tool contract / docs drift / release checklist (gap-analysis #24).
      - name: Quality gates (tool contract, docs drift, release checklist)
        run: npm run quality:all
        env:
          SKIP_TESTS: "1"

      # REV-133: this job hand-replicates the `npm run check` chain step by step
      # instead of invoking it, and `verify:pack` — the last link of that chain —
      # was missing. It is the only gate that inspects tarball CONTENTS (secret
      # files, stray sources, missing bin/dist, undeclared runtime deps), so a
      # `files:` regression reached the release branch with CI fully green and
      # was caught only if someone ran `npm run check` locally. Keep this step in
      # lockstep with the root `check` script; `test/ciCheckChain.test.js` fails
      # the build if a link of the chain has no CI step again.
      - name: Tarball content + bin smoke (verify:pack)
        run: npm run verify:pack

      # G14 regression guard. `scripts/bench.mjs` has existed since G14 and has
      # always supported `--max-ms`, but nothing ever passed a threshold, so the
      # baseline was a number a human had to read and compare by hand. The guard
      # runs the same CPU-bound manifest/doc path with a deliberately loose
      # ceiling (see the THRESHOLD note in scripts/bench.mjs): ~10x the measured
      # local median, so it catches an algorithmic blowup and ignores runner
      # noise. No `npm run build` here — the chain already built above.
      - name: Performance regression guard (bench:guard)
        run: npm run bench:guard

      # Local/CI gate parity. The secret scan used to live ONLY in the
      # `secret-scan` job below, so `npm run check` could be exit 0 on a tree CI
      # would reject — which is exactly how a fixture value reached the default
      # branch and turned it red. `scan:secrets` is the developer-side mirror of
      # that job, and `test/ciCheckChain.test.js` requires every link of the
      # `check` chain to appear here.
      #
      # EXPECT THIS STEP TO REPORT "SKIPPED" on the hosted runners: gitleaks is
      # not an npm dependency and is not preinstalled, and the script says so out
      # loud instead of pretending to have scanned. Enforcement in CI is the
      # `secret-scan` job, which runs gitleaks from a pinned action over the full
      # history and uploads SARIF. Do not "fix" the skip by allowlisting or by
      # dropping the step — its value is that developers get the same answer
      # before they push.
      - name: Secret scan parity check (scan:secrets)
        run: npm run scan:secrets

      # gap-analysis D1: pack-install smoke. The #1 post-publish CLI failure
      # mode is a broken `files:`/`bin:` entry in the published tarball —
      # invisible to workspace-run tests, which execute straight from the
      # source tree. Pack the core CLI plus every @syncrona/* workspace it
      # depends on, install the syncrona tarball into a fresh temp project
      # outside the checkout, and run the installed binary. npm `overrides`
      # pin every @syncrona/* name to its local tarball, so the smoke never
      # touches the registry for scoped deps (they may not be published yet).
      - name: Pack-install smoke (gap-analysis D1)
        run: |
          set -euo pipefail
          PACK_DIR="$(mktemp -d)"
          SMOKE_DIR="$(mktemp -d)"
          # 1. Pack the core CLI plus every @syncrona/* workspace it depends on.
          npm pack --silent --json \
            --workspace syncrona \
            --workspace @syncrona/types \
            --workspace @syncrona/credential-store \
            --workspace @syncrona/jira \
            --workspace @syncrona/sn-transport \
            --workspace @syncrona/mirror \
            --workspace @syncrona/redaction \
            --pack-destination "$PACK_DIR" > "$PACK_DIR/pack.json"
          # 2. Build a fresh consumer project OUTSIDE the checkout. npm `overrides`
          #    map every @syncrona/* name to its local tarball, so the (possibly
          #    unpublished) workspace deps never resolve from the npm registry.
          node -e '
            const fs = require("fs");
            const path = require("path");
            const [packDir, smokeDir] = process.argv.slice(1);
            const packed = JSON.parse(fs.readFileSync(path.join(packDir, "pack.json"), "utf8"));
            const overrides = {};
            let coreTarball = "";
            for (const p of packed) {
              const tarball = path.join(packDir, p.filename);
              if (p.name === "syncrona") coreTarball = tarball;
              else overrides[p.name] = "file:" + tarball;
            }
            if (!coreTarball) throw new Error("core tarball missing from npm pack output");
            fs.writeFileSync(path.join(smokeDir, "package.json"),
              JSON.stringify({ name: "syncrona-pack-smoke", private: true, overrides }, null, 2));
            fs.writeFileSync(path.join(smokeDir, "core-tarball.txt"), coreTarball);
          ' "$PACK_DIR" "$SMOKE_DIR"
          cd "$SMOKE_DIR"
          npm install --no-audit --no-fund "$(cat core-tarball.txt)"
          # 3. Guard: every @syncrona/* dep must have come from a local tarball.
          node -e '
            const lock = require(process.cwd() + "/package-lock.json");
            const bad = Object.entries(lock.packages).filter(([name, meta]) =>
              name.includes("@syncrona/") && !String(meta.resolved).startsWith("file:"));
            if (bad.length) {
              console.error("Resolved from registry instead of local tarballs:", bad.map(([name]) => name));
              process.exit(1);
            }
          '
          # 4. The installed bin must actually run: a broken files:/bin: entry in
          #    the tarball fails here even though workspace-run tests pass.
          ./node_modules/.bin/syncrona --version
          ./node_modules/.bin/syncrona --help

      - name: Upload core coverage artifact
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-coverage
          path: packages/core/coverage
          if-no-files-found: ignore

      # Codecov now measures the full tested surface: one flagged upload per
      # workspace that ships a jest suite (core, jira, credential-store,
      # sn-transport). The untested build-tool plugin packages and mcp-server
      # (own node --test gate) are excluded via codecov.yml `ignore`. The 90%
      # project floor is enforced by Codecov's PR status check, so a transient
      # upload error must not fail CI (fail_ci_if_error: false); disable_search
      # keeps Codecov from double-counting the cobertura report core also emits.
      - name: Upload core coverage to Codecov
        if: always() && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/core/coverage/lcov.info
          flags: core
          name: core
          disable_search: true
          fail_ci_if_error: false

      - name: Upload jira coverage to Codecov
        if: always() && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/jira/coverage/lcov.info
          flags: jira
          name: jira
          disable_search: true
          fail_ci_if_error: false

      - name: Upload credential-store coverage to Codecov
        if: always() && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/credential-store/coverage/lcov.info
          flags: credential-store
          name: credential-store
          disable_search: true
          fail_ci_if_error: false

      - name: Upload sn-transport coverage to Codecov
        if: always() && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/sn-transport/coverage/lcov.info
          flags: sn-transport
          name: sn-transport
          disable_search: true
          fail_ci_if_error: false

      - name: Upload redaction coverage to Codecov
        if: always() && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/redaction/coverage/lcov.info
          flags: redaction
          name: redaction
          disable_search: true
          fail_ci_if_error: false

      - name: Upload mirror coverage to Codecov
        if: always() && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/mirror/coverage/lcov.info
          flags: mirror
          name: mirror
          disable_search: true
          fail_ci_if_error: false

  # G16: secret scanning across the full git history — the enforcing gate.
  #
  # .gitleaks.toml no longer allowlists test directories (a real credential once
  # leaked from a test path), so fixture values are exempt only by matching the
  # placeholder-value regexes or by carrying an inline `gitleaks:allow` comment
  # that says why the value is inert. A fixture that trips a rule fails THIS job.
  #
  # `npm run scan:secrets` in the check job is the developer-side mirror of this
  # scan, not a replacement: it runs the same config over the working tree so a
  # finding surfaces before the push instead of on a red default branch.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
